<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>FoodShare - Available Food</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient( 135deg, #eefaf2, #e2f6e9 ); color: #26352d; } header { background: #168653; color: white; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; } .logo { font-size: 28px; font-weight: bold; } .logo span { color: #ffd08a; } .dashboard-link { color: white; text-decoration: none; font-weight: bold; } .container { width: 92%; max-width: 1100px; margin: 30px auto; } h1 { color: #168653; margin-bottom: 8px; } .subtitle { color: #666; margin-bottom: 25px; } .filter-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06); } .filter-box label { display: block; font-weight: bold; margin-bottom: 8px; } select { width: 100%; max-width: 450px; padding: 12px; border: 1px solid #ccd8d0; border-radius: 8px; font-size: 15px; } .food-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; } .food-card { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07); } .food-title { color: #168653; font-size: 21px; font-weight: bold; margin-bottom: 14px; } .food-info { margin: 10px 0; line-height: 1.5; } .food-location { background: #f0faf4; padding: 12px; border-radius: 9px; margin: 14px 0; color: #176c43; line-height: 1.5; } .claim-btn { width: 100%; border: none; padding: 13px; border-radius: 9px; background: #168653; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; } .claim-btn:hover { background: #116c43; } .empty { background: white; padding: 30px; text-align: center; border-radius: 15px; color: #666; } .loading { text-align: center; padding: 30px; color: #666; } /* MODAL */ .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0, 0, 0, 0.55); padding: 20px; } .modal-content { background: white; max-width: 500px; margin: 7% auto; padding: 28px; border-radius: 18px; position: relative; } .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #666; } .modal h2 { color: #168653; margin-top: 0; } .modal label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: bold; } .modal input, .modal textarea { width: 100%; padding: 12px; border: 1px solid #ccd8d0; border-radius: 8px; font-size: 15px; } .modal textarea { min-height: 90px; resize: vertical; } .modal-submit { width: 100%; border: none; padding: 13px; background: #168653; color: white; border-radius: 9px; margin-top: 18px; font-size: 16px; font-weight: bold; cursor: pointer; } .modal-message { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; } .success { background: #eaf8ef; color: #168653; } .error { background: #ffeaea; color: #b42318; } .donor-contact { background: #fff8e8; padding: 14px; border-radius: 10px; margin-top: 14px; } </style> </head> <body> <header> <div class="logo"> Food<span>Share</span> </div> <a href="receiver.html" class="dashboard-link" > Receiver Dashboard </a> </header> <div class="container"> <h1>Available Food</h1> <div class="subtitle"> Find available food donations near you and claim what you need. </div> <!-- FILTER --> <div class="filter-box"> <label for="localityFilter"> Filter by Pickup Location </label> <select id="localityFilter"> <option value=""> All Locations </option> </select> </div> <!-- FOOD LIST --> <div id="foodContainer" class="food-grid" > <div class="loading"> Loading available food... </div> </div> </div> <!-- CLAIM MODAL --> <div id="claimModal" class="modal" > <div class="modal-content"> <span class="close" id="closeModal" > &times; </span> <h2>Claim Food</h2> <div id="selectedFood"></div> <form id="claimForm"> <label for="receiverPhone"> Your Phone Number </label> <input type="tel" id="receiverPhone" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required > <label for="claimMessage"> Message to Donor </label> <textarea id="claimMessage" placeholder="Enter a message for the donor..." ></textarea> <button type="submit" class="modal-submit" id="claimSubmitBtn" > Confirm Claim </button> </form> <div id="modalMessage" class="modal-message" ></div> </div> </div> <script> // ----------------------------------------- // LOGIN CHECK // ----------------------------------------- const receiverId = localStorage.getItem("foodshareUserId"); const receiverName = localStorage.getItem("foodshareCurrentUser") || "Receiver"; const receiverRole = localStorage.getItem("foodshareUserRole"); if ( !receiverId || receiverRole !== "receiver" ) { window.location.href = "signin.html"; } // ----------------------------------------- // ELEMENTS // ----------------------------------------- const foodContainer = document.getElementById("foodContainer"); const localityFilter = document.getElementById("localityFilter"); const claimModal = document.getElementById("claimModal"); const closeModal = document.getElementById("closeModal"); const claimForm = document.getElementById("claimForm"); const selectedFoodElement = document.getElementById("selectedFood"); const modalMessage = document.getElementById("modalMessage"); const claimSubmitBtn = document.getElementById("claimSubmitBtn"); let allFoods = []; let selectedDonation = null; // ----------------------------------------- // ESCAPE HTML // ----------------------------------------- function escapeHtml(value) { if (value === null || value === undefined) { return ""; } return String(value) .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } // ----------------------------------------- // DATE FORMAT // ----------------------------------------- function formatDate(dateString) { if (!dateString) { return "Not available"; } const date = new Date( dateString.replace(" ", "T") ); if (isNaN(date.getTime())) { return dateString; } return date.toLocaleString( "en-IN", { dateStyle: "medium", timeStyle: "short" } ); } // ----------------------------------------- // LOAD FOOD // ----------------------------------------- async function loadFood() { foodContainer.innerHTML = '<div class="loading">Loading available food...</div>'; try { const response = await fetch( "available_food.php" ); const result = await response.json(); if (!result.success) { foodContainer.innerHTML = '<div class="empty">Unable to load food donations.</div>'; return; } allFoods = result.foods || []; buildLocationFilter(); displayFoods(allFoods); } catch (error) { console.error(error); foodContainer.innerHTML = '<div class="empty">Unable to connect to the server.</div>'; } } // ----------------------------------------- // BUILD LOCATION FILTER // ----------------------------------------- function buildLocationFilter() { localityFilter.innerHTML = '<option value="">All Locations</option>'; const locations = new Set(); allFoods.forEach(function(food) { const location = food.location_name || food.pickup_location || food.locality || ""; if (location.trim() !== "") { locations.add(location); } }); Array.from(locations) .sort() .forEach(function(location) { const option = document.createElement("option"); option.value = location; option.textContent = location; localityFilter.appendChild(option); }); } // ----------------------------------------- // DISPLAY FOODS // ----------------------------------------- function displayFoods(foods) { if (!foods || foods.length === 0) { foodContainer.innerHTML = '<div class="empty">No available food donations found.</div>'; return; } foodContainer.innerHTML = ""; foods.forEach(function(food) { // IMPORTANT: // This is the SAME location_name // saved by the donor. const pickupLocation = food.location_name || food.pickup_location || food.locality || "Location unavailable"; const card = document.createElement("div"); card.className = "food-card"; card.innerHTML = ` <div class="food-title"> ${escapeHtml(food.food_type)} </div> <div class="food-info"> <strong>👤 Donor:</strong> ${escapeHtml(food.donor_name)} </div> <div class="food-info"> <strong>🍱 Quantity:</strong> ${escapeHtml(food.quantity)} </div> <div class="food-location"> 📍 <strong>Pickup Location:</strong><br> ${escapeHtml(pickupLocation)} </div> <div class="food-info"> <strong>🕐 Pickup:</strong> ${escapeHtml( formatDate(food.pickup_datetime) )} </div> <div class="food-info"> <strong>⏳ Expires:</strong> ${escapeHtml( formatDate(food.expiry_datetime) )} </div> ${ food.details ? ` <div class="food-info"> <strong>📝 Details:</strong> ${escapeHtml(food.details)} </div> ` : "" } <button class="claim-btn" onclick="openClaimModal(${food.donation_id})" > Claim Food </button> `; foodContainer.appendChild(card); }); } // ----------------------------------------- // FILTER // ----------------------------------------- localityFilter.addEventListener( "change", function() { const selected = this.value; if (!selected) { displayFoods(allFoods); return; } const filtered = allFoods.filter( function(food) { const location = food.location_name || food.pickup_location || food.locality || ""; return location === selected; } ); displayFoods(filtered); } ); // ----------------------------------------- // OPEN CLAIM MODAL // ----------------------------------------- function openClaimModal(donationId) { selectedDonation = allFoods.find( function(food) { return Number(food.donation_id) === Number(donationId); } ); if (!selectedDonation) { alert( "Food donation not found." ); return; } const pickupLocation = selectedDonation.location_name || selectedDonation.pickup_location || selectedDonation.locality || "Location unavailable"; selectedFoodElement.innerHTML = ` <div class="food-info"> <strong>Food:</strong> ${escapeHtml( selectedDonation.food_type )} </div> <div class="food-info"> <strong>Quantity:</strong> ${escapeHtml( selectedDonation.quantity )} </div> <div class="food-info"> <strong>Pickup Location:</strong> ${escapeHtml( pickupLocation )} </div> <div class="food-info"> <strong>Pickup Time:</strong> ${escapeHtml( formatDate( selectedDonation.pickup_datetime ) )} </div> `; document.getElementById( "receiverPhone" ).value = ""; document.getElementById( "claimMessage" ).value = ""; modalMessage.style.display = "none"; claimModal.style.display = "block"; } // ----------------------------------------- // CLOSE MODAL // ----------------------------------------- closeModal.onclick = function() { claimModal.style.display = "none"; }; window.onclick = function(event) { if (event.target === claimModal) { claimModal.style.display = "none"; } }; // ----------------------------------------- // CLAIM FOOD // ----------------------------------------- claimForm.addEventListener( "submit", async function(event) { event.preventDefault(); if (!selectedDonation) { return; } const receiverPhone = document.getElementById( "receiverPhone" ).value.trim(); const message = document.getElementById( "claimMessage" ).value.trim(); if ( !/^[6-9][0-9]{9}$/ .test(receiverPhone) ) { showModalMessage( "Please enter a valid 10-digit mobile number.", "error" ); return; } claimSubmitBtn.disabled = true; claimSubmitBtn.textContent = "Processing..."; const data = { donation_id: Number( selectedDonation.donation_id ), receiver_id: Number(receiverId), receiver_name: receiverName, receiver_phone: receiverPhone, message: message }; try { const response = await fetch( "claim_food.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } ); const result = await response.json(); if (result.success) { const pickupLocation = result.location_name || result.locality || selectedDonation.location_name || selectedDonation.pickup_location || selectedDonation.locality || "Location unavailable"; showModalMessage( ` <strong>Food claimed successfully!</strong> <br><br> Donor: ${escapeHtml( result.donor_name || selectedDonation.donor_name )} <br> Contact: ${escapeHtml( result.donor_contact || selectedDonation.contact )} <br> Pickup Location: ${escapeHtml( pickupLocation )} <br> Pickup Time: ${escapeHtml( formatDate( result.pickup_datetime || selectedDonation.pickup_datetime ) )} `, "success" ); // Remove claimed food allFoods = allFoods.filter( function(food) { return Number( food.donation_id ) !== Number( selectedDonation.donation_id ); } ); setTimeout( function() { claimModal.style.display = "none"; buildLocationFilter(); displayFoods( allFoods ); }, 2500 ); } else { showModalMessage( result.message || "Unable to claim food.", "error" ); } } catch (error) { console.error(error); showModalMessage( "Unable to connect to the server.", "error" ); } finally { claimSubmitBtn.disabled = false; claimSubmitBtn.textContent = "Confirm Claim"; } } ); // ----------------------------------------- // MODAL MESSAGE // ----------------------------------------- function showModalMessage( message, type ) { modalMessage.innerHTML = message; modalMessage.className = "modal-message " + type; modalMessage.style.display = "block"; } // ----------------------------------------- // INITIAL LOAD // ----------------------------------------- loadFood(); </script> </body> </html>
