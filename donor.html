<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Donor Home | FoodShare</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #eefaf2, #e2f6e9); color: #26352c; } header { background: #168653; color: white; padding: 18px 35px; display: flex; justify-content: space-between; align-items: center; } .logo { font-size: 26px; font-weight: bold; } nav { display: flex; gap: 20px; align-items: center; } nav a { color: white; text-decoration: none; font-weight: bold; } .logout { background: #ef9d31; border: none; color: white; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; } .container { width: 92%; max-width: 1200px; margin: 35px auto; } .top-section { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 25px; } h1 { margin: 0; color: #168653; } .donate-btn { background: #168653; color: white; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; } .notification { display: none; background: #fff5df; border-left: 5px solid #ef9d31; padding: 15px; margin-bottom: 20px; border-radius: 10px; } .notification strong { color: #168653; } .empty { background: white; padding: 40px; border-radius: 18px; text-align: center; box-shadow: 0 5px 18px rgba(0,0,0,0.08); } .food-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; } .food-card { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 5px 18px rgba(0,0,0,0.08); position: relative; } .food-card.claimed { border: 2px solid #ef9d31; } .status { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 12px; } .available { background: #dff5e8; color: #168653; } .claimed { background: #fff0d6; color: #b66b00; } .food-card h2 { margin: 5px 0 15px; color: #168653; } .info { margin: 9px 0; line-height: 1.5; } .info b { color: #444; } .claim-box { margin-top: 18px; padding: 15px; background: #fff8ec; border-radius: 12px; } .claim-box h3 { margin-top: 0; color: #b66b00; } .actions { display: flex; gap: 10px; margin-top: 18px; } .actions button { flex: 1; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; } .edit-btn { background: #168653; color: white; } .delete-btn { background: #dc3545; color: white; } .edit-btn:disabled, .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; } /* Modal */ .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 1000; } .modal-box { background: white; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; border-radius: 18px; padding: 25px; } .modal-box h2 { color: #168653; margin-top: 0; } .form-group { margin-bottom: 14px; } .form-group label { display: block; margin-bottom: 6px; font-weight: bold; } .form-group input, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; } .form-group textarea { min-height: 80px; resize: vertical; } .modal-actions { display: flex; gap: 10px; margin-top: 20px; } .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; } .save-btn { background: #168653; color: white; } .cancel-btn { background: #ddd; } @media(max-width: 700px) { header { padding: 15px; } nav { gap: 10px; } .top-section { flex-direction: column; align-items: flex-start; } } </style> </head> <body> <header> <div class="logo"> Food<span style="color:#ef9d31;">Share</span> </div> <nav> <a href="donor.html">Home</a> <a href="donate-food.html">Donate Food</a> <a href="donate-fund.html">Donate Fund</a> <button class="logout" onclick="logout()"> Logout </button> </nav> </header> <div class="container"> <div class="top-section"> <div> <h1>My Food Donations</h1> <p>Manage the food you have donated.</p> </div> <a href="donate-food.html" class="donate-btn"> + Donate Food </a> </div> <div id="notification" class="notification"></div> <div id="empty" class="empty" style="display:none;"> <h2>No active food donations</h2> <p>Your active food donations will appear here.</p> </div> <div id="foodGrid" class="food-grid"></div> </div> <!-- EDIT MODAL --> <div id="editModal" class="modal"> <div class="modal-box"> <h2>Edit Food Donation</h2> <input type="hidden" id="editDonationId"> <div class="form-group"> <label>Food Type</label> <input type="text" id="editFoodType"> </div> <div class="form-group"> <label>Quantity</label> <input type="text" id="editQuantity"> </div> <div class="form-group"> <label>Pickup Date & Time</label> <input type="datetime-local" id="editPickup"> </div> <div class="form-group"> <label>Expiry Date & Time</label> <input type="datetime-local" id="editExpiry"> </div> <div class="form-group"> <label>Locality</label> <input type="text" id="editLocality"> </div> <div class="form-group"> <label>Pickup Location</label> <input type="text" id="editLocation"> </div> <div class="form-group"> <label>Details</label> <textarea id="editDetails"></textarea> </div> <div class="modal-actions"> <button class="save-btn" onclick="saveEdit()"> Save Changes </button> <button class="cancel-btn" onclick="closeEdit()"> Cancel </button> </div> </div> </div> <script> const userId = localStorage.getItem("foodshareUserId"); const role = localStorage.getItem("foodshareUserRole"); if (!userId || localStorage.getItem("foodshareLoggedIn") !== "true") { window.location.href = "signin.html"; } if (role !== "donor") { if (role === "receiver") { window.location.href = "receiver.html"; } else if (role === "admin") { window.location.href = "admin.html"; } else { window.location.href = "signin.html"; } } let donations = []; let previousClaims = new Set(); async function loadDonations(showNotification = true) { try { const response = await fetch( "donor_food.php?user_id=" + encodeURIComponent(userId) + "&t=" + Date.now() ); const result = await response.json(); if (!result.success) { throw new Error(result.message || "Unable to load donations."); } donations = result.data || []; /* * Check for new claims. */ if (showNotification) { donations.forEach(food => { if ( food.is_claimed && food.claim_id && !previousClaims.has(String(food.claim_id)) ) { showClaimNotification(food); } }); } previousClaims = new Set( donations .filter(food => food.claim_id) .map(food => String(food.claim_id)) ); displayDonations(); } catch (error) { console.error(error); document.getElementById("foodGrid").innerHTML = ` <div class="empty"> <h2>Unable to load donations</h2> <p>${escapeHtml(error.message)}</p> </div> `; } } function displayDonations() { const grid = document.getElementById("foodGrid"); const empty = document.getElementById("empty"); grid.innerHTML = ""; if (!donations.length) { empty.style.display = "block"; return; } empty.style.display = "none"; donations.forEach(food => { const claimed = food.status === "Claimed"; const card = document.createElement("div"); card.className = "food-card" + (claimed ? " claimed" : ""); let claimHTML = ""; if (claimed && food.claim_id) { claimHTML = ` <div class="claim-box"> <h3> 🔔 Food Claimed </h3> <div class="info"> <b>Receiver:</b> ${escapeHtml(food.receiver_name || "Not available")} </div> <div class="info"> <b>Phone:</b> ${escapeHtml(food.receiver_phone || "Not available")} </div> <div class="info"> <b>Receiver Message:</b> ${escapeHtml(food.receiver_message || "No message")} </div> <div class="info"> <b>Claimed On:</b> ${formatDate(food.claim_created_at)} </div> </div> `; } card.innerHTML = ` <span class="status ${claimed ? "claimed" : "available"}"> ${claimed ? "CLAIMED" : "AVAILABLE"} </span> <h2> ${escapeHtml(food.food_type)} </h2> <div class="info"> <b>Quantity:</b> ${escapeHtml(food.quantity)} </div> <div class="info"> <b>Pickup:</b> ${formatDate(food.pickup_datetime)} </div> <div class="info"> <b>Expires:</b> ${formatDate(food.expiry_datetime)} </div> <div class="info"> <b>Locality:</b> ${escapeHtml(food.locality)} </div> <div class="info"> <b>Pickup Location:</b> ${escapeHtml(food.pickup_location || food.location_name || food.locality)} </div> ${ food.details ? ` <div class="info"> <b>Details:</b> ${escapeHtml(food.details)} </div> ` : "" } ${claimHTML} <div class="actions"> <button class="edit-btn" ${claimed ? "disabled" : ""} onclick="openEdit(${food.donation_id})"> Edit </button> <button class="delete-btn" onclick="deleteDonation(${food.donation_id})"> Delete </button> </div> `; grid.appendChild(card); }); } function showClaimNotification(food) { const notification = document.getElementById("notification"); notification.style.display = "block"; notification.innerHTML = ` <strong>🔔 Your food donation has been claimed!</strong> <br><br> <b>Food:</b> ${escapeHtml(food.food_type)} <br> <b>Receiver:</b> ${escapeHtml(food.receiver_name)} <br> <b>Phone:</b> ${escapeHtml(food.receiver_phone)} <br><br> The receiver has claimed this donation. `; /* * Browser notification if permission is available. */ if ("Notification" in window) { if (Notification.permission === "granted") { new Notification("FoodShare - Food Claimed", { body: food.receiver_name + " claimed your " + food.food_type + " donation." }); } else if (Notification.permission === "default") { Notification.requestPermission(); } } } function openEdit(id) { const food = donations.find(item => Number(item.donation_id) === Number(id) ); if (!food) { alert("Donation not found."); return; } if (food.status === "Claimed") { alert("A claimed donation cannot be edited."); return; } document.getElementById("editDonationId").value = food.donation_id; document.getElementById("editFoodType").value = food.food_type || ""; document.getElementById("editQuantity").value = food.quantity || ""; document.getElementById("editPickup").value = toDatetimeLocal(food.pickup_datetime); document.getElementById("editExpiry").value = toDatetimeLocal(food.expiry_datetime); document.getElementById("editLocality").value = food.locality || ""; document.getElementById("editLocation").value = food.location_name || ""; document.getElementById("editDetails").value = food.details || ""; document.getElementById("editModal").style.display = "flex"; } function closeEdit() { document.getElementById("editModal").style.display = "none"; } async function saveEdit() { const formData = new FormData(); formData.append( "donation_id", document.getElementById("editDonationId").value ); formData.append("user_id", userId); formData.append( "food_type", document.getElementById("editFoodType").value.trim() ); formData.append( "quantity", document.getElementById("editQuantity").value.trim() ); formData.append( "pickup_datetime", document.getElementById("editPickup").value ); formData.append( "expiry_datetime", document.getElementById("editExpiry").value ); formData.append( "locality", document.getElementById("editLocality").value.trim() ); formData.append( "location_name", document.getElementById("editLocation").value.trim() ); formData.append( "details", document.getElementById("editDetails").value.trim() ); try { const response = await fetch("edit_food.php", { method: "POST", body: formData }); const result = await response.json(); if (!result.success) { throw new Error( result.message || "Unable to update donation." ); } alert("Donation updated successfully."); closeEdit(); loadDonations(false); } catch (error) { alert(error.message); } } async function deleteDonation(id) { const food = donations.find(item => Number(item.donation_id) === Number(id) ); if (!food) { return; } const confirmed = confirm( "Are you sure you want to delete your " + food.food_type + " donation?" ); if (!confirmed) { return; } const formData = new FormData(); formData.append("donation_id", id); formData.append("user_id", userId); try { const response = await fetch("delete_food.php", { method: "POST", body: formData }); const result = await response.json(); if (!result.success) { throw new Error( result.message || "Unable to delete donation." ); } alert("Donation deleted successfully."); loadDonations(false); } catch (error) { alert(error.message); } } function formatDate(value) { if (!value) { return "-"; } const date = new Date(value.replace(" ", "T")); if (isNaN(date.getTime())) { return value; } return date.toLocaleString(); } function toDatetimeLocal(value) { if (!value) { return ""; } return value .replace(" ", "T") .substring(0, 16); } function escapeHtml(value) { if (value === null || value === undefined) { return ""; } return String(value) .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function logout() { localStorage.removeItem("foodshareLoggedIn"); localStorage.removeItem("foodshareCurrentUser"); localStorage.removeItem("foodshareUserRole"); localStorage.removeItem("foodshareUserId"); window.location.href = "signin.html"; } /* * Initial load. */ loadDonations(false); /* * Check every 10 seconds for: * * 1. New claims * 2. Newly expired food * * Expired donations automatically disappear because * donor_food.php only returns expiry_datetime > NOW(). */ setInterval(() => { loadDonations(true); }, 10000); /* * Close modal if user clicks outside it. */ document.getElementById("editModal") .addEventListener("click", function(event) { if (event.target === this) { closeEdit(); } }); </script> </body> </html>
